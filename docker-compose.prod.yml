# Production compose configuration
version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: human-ai-co-create-mongodb-prod
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=human_ai_co_create
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - human-ai-network
    command: mongod --auth

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: human-ai-co-create-app-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/human_ai_co_create?authSource=human_ai_co_create
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-https://your-domain.com}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_HOURS=24
      - PYTHONPATH=/app/server
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - human-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: human-ai-co-create-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - human-ai-network

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: human-ai-co-create-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - human-ai-network

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: human-ai-co-create-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - human-ai-network

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:

networks:
  human-ai-network:
    driver: bridge
