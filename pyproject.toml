[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "human-ai-co-create"
version = "0.1.0"
description = "Human-AI Co-Creation System for Writer's Block"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "BTech Project", email = "project@example.com"},
]
keywords = ["ai", "writing", "collaboration", "nlp", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Async HTTP and database
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    "python-arango>=7.8.0",
    "aioarango>=2.0.0",
    
    # LLM and AI
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-core>=0.1.0",
    "langchain-huggingface>=0.0.1",
    "langchain-google-genai>=1.0.0",
    "langchain-openai>=0.0.5",
    "langchain-groq>=0.0.1",
    "langgraph>=0.0.20",
    "crewai>=0.22.0",
    
    # Embeddings and vector operations
    "sentence-transformers>=2.2.2",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "einops>=0.7.0",
    "chromadb>=0.4.18",
    "faiss-cpu>=1.7.4",
    
    # NLP
    "spacy>=3.7.0",
    "stanza>=1.7.0",
    "nltk>=3.8.1",
    
    # Utilities
    "aiofiles>=23.2.0",
    "asyncio-mqtt>=0.16.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "jsonschema>=4.20.0",
    "markdown>=3.5.0",
    
    # Logging and monitoring
    "structlog>=23.2.0",
    "colorama>=0.4.6",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",
    "asgi-lifespan>=2.1.0",
    
    # Code quality
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    
    # Type stubs
    "types-redis>=4.6.0",
    "types-python-dateutil>=2.8.19",
    "types-pytz>=2023.3.1.1",
]

[project.urls]
Homepage = "https://github.com/your-username/human-ai-co-create"
Repository = "https://github.com/your-username/human-ai-co-create"
Issues = "https://github.com/your-username/human-ai-co-create/issues"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["server", "agents", "utils"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "spacy.*",
    "stanza.*",
    "transformers.*",
    "sentence_transformers.*",
    "chromadb.*",
    "faiss.*",
    "crewai.*",
    "langgraph.*",
    "aioarango.*",
    "motor.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["server/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["server"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
