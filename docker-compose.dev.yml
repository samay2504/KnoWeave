# Development compose for local development
version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: human-ai-co-create-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=human_ai_co_create
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - human-ai-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: human-ai-co-create-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/human_ai_co_create
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=http://localhost:3000
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_HOURS=24
      - PYTHONPATH=/app/server
    volumes:
      - ./server:/app/server
      - ./logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - human-ai-network
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: human-ai-co-create-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - human-ai-network
    stdin_open: true
    tty: true

  # Optional: Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: human-ai-co-create-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - human-ai-network
    command: redis-server --appendonly yes

volumes:
  mongodb_data:
  redis_data:

networks:
  human-ai-network:
    driver: bridge
