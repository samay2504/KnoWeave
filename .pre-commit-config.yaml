repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        language_version: python3
        files: ^server/
        args: [--line-length=88, --target-version=py39]

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        files: ^server/
        args: [--max-line-length=88, --extend-ignore=E203,W503]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        files: ^server/
        args: [--profile=black, --line-length=88]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
      - id: mypy
        files: ^server/
        additional_dependencies: [types-requests, types-PyYAML]
        args: [--ignore-missing-imports, --strict]

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        files: ^server/
        args: [-r, ., -f, json, -x, "*/tests/*"]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.50.0
    hooks:
      - id: eslint
        files: ^web/src/.*\.(js|jsx|ts|tsx)$
        additional_dependencies:
          - eslint@8.50.0
          - eslint-plugin-react@7.33.2
          - eslint-plugin-react-hooks@4.6.0
          - "@typescript-eslint/eslint-plugin@6.7.2"
          - "@typescript-eslint/parser@6.7.2"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        files: ^web/src/.*\.(js|jsx|ts|tsx|json|css|md)$
        additional_dependencies:
          - prettier@3.0.3
          - prettier-plugin-tailwindcss@0.5.4

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'cd server && python -m pytest tests/ --maxfail=1'
        language: system
        pass_filenames: false
        files: ^server/
        types: [python]

      - id: npm-test
        name: npm test
        entry: bash -c 'cd web && npm test -- --watchAll=false --passWithNoTests'
        language: system
        pass_filenames: false
        files: ^web/src/
        types_or: [javascript, jsx]

      - id: requirements-check
        name: requirements check
        entry: bash -c 'cd server && python -m pip check'
        language: system
        pass_filenames: false
        files: ^requirements\.txt$

      - id: package-lock-check
        name: package-lock check
        entry: bash -c 'cd web && npm audit --audit-level=moderate'
        language: system
        pass_filenames: false
        files: ^web/package-lock\.json$
